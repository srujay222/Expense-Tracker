<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">💰 Smart Expense Tracker</h2>

    <div class="card p-4 shadow-sm mb-4">
        <form method="POST">
            <div class="row">
                <div class="col">
                    <input type="text" name="item" class="form-control" placeholder="Expense Name (e.g. Milk)" required>
                </div>
                <div class="col">
                    <input type="number" name="amount" class="form-control" placeholder="Amount (₹)" required>
                </div>
                <div class="col">
                    <select name="category" class="form-control">
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Bills</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col">
                    <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                </div>
            </div>
        </form>
    </div>

    <table class="table table-striped table-hover bg-white rounded shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Expense Item</th>
                <th>Category</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ expense['item'] }}</td>
                <td><span class="badge bg-secondary">{{ expense['category'] }}</span></td>
                <td>₹{{ expense['amount'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
